<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Envelope Budgeter</title>
  </head>

  <body>
    <main>
      <h1>Sistema de Presupuesto</h1>
      <div class="container">
        <form id="budget-form">
          <label for="income">Ingreso Mensual:</label>
          <input
            type="number"
            min="0"
            id="income"
            placeholder="Ingrese un valor"
            required
            title="Ingreso Mensual"
          />

          <fieldset id="rent">
            <legend>Alquiler</legend>
            <label for="rent-amount">Cantidad:</label>
            <input
              type="number"
              min="0"
              id="rent-amount"
              placeholder="Ingrese un valor"
              title="Valor de Alquiler"
            />
          </fieldset>

          <div class="controls">
            <span>
              <label for="entry-dropdown">Agregar Gasto:</label>
              <select id="entry-dropdown" name="options">
                <option value="food" selected>Comida</option>
                <option value="utilities">Utilidades</option>
                <option value="entertainment">Entretenimiento</option>
              </select>
              <button type="button" id="add-entry">Agregar Entrada</button>
            </span>
          </div>

          <fieldset id="food">
            <legend>Comida</legend>
            <div class="input-container"></div>
          </fieldset>

          <fieldset id="utilities">
            <legend>Utilidades</legend>
            <div class="input-container"></div>
          </fieldset>

          <fieldset id="entertainment">
            <legend>Entretenimiento</legend>
            <div class="input-container"></div>
          </fieldset>
          <div>
            <button type="submit">Calcular Presupuesto Restantante</button>
            <button type="button" id="clear">Borrar</button>
          </div>
        </form>

        <div id="output" class="output hide"></div>
      </div>
    </main>
    <script src="./main.js"></script>
  </body>
</html>
